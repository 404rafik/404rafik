name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Diagnostic - test secret in Actions env
        run: |
          echo "token length: ${#METRICS_TOKEN}"
          echo "token prefix: ${METRICS_TOKEN:0:4}"
          echo "token suffix: ${METRICS_TOKEN: -4}"
          $(curl -s -H "Authorization: token ${METRICS_TOKEN}" https://api.github.com/user | head -c 200)
          echo "REST check: $TOKEN_TEST"
          $(curl -s -X POST -H "Authorization: bearer ${METRICS_TOKEN}" -H "Content-Type: application/json" \
            -d '{"query":"query { user(login: \"404rafik\") { login } }"}' https://api.github.com/graphql | head -c 200)
          echo "GraphQL check: $GRAPHQL_TEST"
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
