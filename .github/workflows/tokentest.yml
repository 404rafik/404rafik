name: Token Pipeline Test
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run mini composite to test toJson(inputs) masking
        id: mini
        uses: ./.github/actions/tokentest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
      - name: Show result
        run: |
          echo "mini got: ${{ steps.mini.outputs.token_received }}"
          echo "mini got len: ${{ steps.mini.outputs.token_len }}"
